name: hud

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hud
      POSTGRES_USER: hud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${HUD_BIND_ADDR:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hud -d hud"]
      interval: 10s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set in .env}
      GENERIC_TIMEZONE: ${TZ:-UTC}
    volumes:
      - n8ndata:/home/node/.n8n
      - ${SYNC_DIR:?set in .env}:/data/sync:ro # Syncthing folder, read-only for n8n
    ports:
      - "${HUD_BIND_ADDR:-127.0.0.1}:5678:5678"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "${HUD_BIND_ADDR:-127.0.0.1}:3000:3000"

volumes:
  pgdata:
  n8ndata:
  grafanadata:
