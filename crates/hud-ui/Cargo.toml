[package]
name = "hud-ui"
description = "Dioxus shell for hud: navigation and the plugin page registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dioxus = "0.7"
hud-client = { version = "0.1.0", path = "../hud-client" }
hud-store = { version = "0.1.0", path = "../hud-store" }
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
dioxus-ssr = "0.7"
hud-core = { path = "../hud-core" }
