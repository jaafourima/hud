[package]
name = "hud-server"
description = "hud sync server: accounts, device tokens, sync, Postgres with row-level security"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
axum = "0.8"
base64 = "0.23.1"
deadpool-postgres = "0.14.2"
hud-core = { version = "0.1.0", path = "../hud-core" }
hud-plugin-body = { version = "0.1.0", path = "../../plugins/body" }
hud-sync = { version = "0.1.0", path = "../hud-sync" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-serde_json-1"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }

[dev-dependencies]
hud-plugin-body = { path = "../../plugins/body" }
hud-store = { path = "../hud-store" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
